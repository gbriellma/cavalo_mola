; Cavalo Mola — núcleo determinístico de danos em pavimentos na ESP32-CAM (AI-Thinker)
; Câmera NÃO é usada: as imagens vêm do cartão microSD (pasta /pav/entrada).
[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 240000000L
monitor_filters = esp32_exception_decoder
upload_speed = 460800
; PSRAM de 4 MB é obrigatória (memória de trabalho ~2,6 MB para 512x320)
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -O2
build_unflags = -Os
